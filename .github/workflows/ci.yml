name: CI
on: [push, pull_request]
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest], python: ['3.10','3.12'] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile cull_core.py cull_desktop.pyw
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: powershell
        run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: Cull-windows, path: dist/Cull.exe }

  package:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      APP: Cull
      ENTRY: cull_desktop.pyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pyinstaller pillow
          if [ -f tools/make_icon.py ]; then python tools/make_icon.py; fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            icon=()
            for f in assets/icon.png assets/icon.ico; do
              if [ -f "$f" ]; then icon=(--icon "$f"); break; fi
            done
            python -m PyInstaller --noconfirm --clean --windowed --name "$APP" "${icon[@]}" "$ENTRY"
            test -d "dist/$APP.app"
          else
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name "$APP" "$ENTRY"
            test -x "dist/$APP"
          fi
